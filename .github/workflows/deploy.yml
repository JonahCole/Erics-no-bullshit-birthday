name: Deploy Eric Birthday Hunt

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build versioned static site
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _site/assets
          cp index.html styles.css app.js _site/

          curl --location --fail --retry 3 \
            "https://github.com/buddingmonkey/FreeFirearmsSFXLibrary/raw/refs/heads/main/Prepared%20SFX/Tikka/W_29P.wav" \
            --output _site/assets/rifle-shot.wav

          sed -i "s/__VERSION__/${GITHUB_SHA}/g" _site/index.html
          sed -i "s/__VERSION__/${GITHUB_SHA}/g" _site/app.js

          printf '{"version":"%s"}\n' "$GITHUB_SHA" > _site/version.json

          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
